name: Sync kids feed

on:
  schedule:
    - cron: "0 4 * * *"   # 10:00 PM US Central, after the Kids Pulse nightly run
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed.json from the Google sheet
        run: python sync.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- feed.json; then
            echo "No changes."
          else
            git config user.name "kids-feed-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed.json
            git commit -m "Update feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
